[package]
name = "omnibuf-php-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "omnibuf_php_rs"
crate-type = ["staticlib"]

[dependencies]
omnibuf_core = { package = "omnibuf", path = "../../../omnibuf-rs/crates/omnibuf", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package]
name = "omnibuf"
version = "0.1.6"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "omnibuf"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "=0.16.4"
omnibuf_core = { package = "omnibuf", version = "0.1.5", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: PHP Format, PHPStan, PHPUnit & Conformance (PHP ${{ matrix.php }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer:v2

      - name: Install buf and just via mise
        uses: jdx/mise-action@v5
        with:
          install_args: buf just

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install conformance-runner
        run: |
          mise use -g go@1.25
          GOBIN="$HOME/.local/bin" mise exec -- go install github.com/omnibuf/omnibuf-go/cmd/conformance-runner@latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full CI suite
        run: just ci
